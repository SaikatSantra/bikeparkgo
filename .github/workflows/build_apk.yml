name: Build PujoBike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Project
        run: flutter create --platforms=android --org com.bikeparkgo .

      - name: Configure Android Permissions and MinSdk 21
        run: python3 scripts/setup_android.py

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BikeParkGo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
