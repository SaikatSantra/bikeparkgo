name: Build PujoBike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Ensure SDK 35
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          echo "Installing platforms;android-35..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" > /dev/null 2>&1 || true

      - name: Generate Official Android Project with Wrapper
        run: |
          flutter create --platforms=android --org com.bikeparkgo .
          chmod +x android/gradlew

      - name: Generate Production Keystore
        run: |
          keytool -genkey -v -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass bikeparkgo123 -keypass bikeparkgo123 -dname "CN=BikeParkGo, OU=PujoBike, O=Saitriq, L=Kolkata, ST=WestBengal, C=IN"

      - name: Generate App Icons & Configure Android
        run: |
          node scripts/generate_icons.js
          node scripts/configure_android.js

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Patch Legacy Plugins in Pub Cache
        run: |
          echo "Patching any legacy android.flutter references in pub-cache..."
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/android.flutter.compileSdkVersion/35/g' {} + 2>/dev/null || true
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/android.flutter.minSdkVersion/21/g' {} + 2>/dev/null || true
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/android.flutter.targetSdkVersion/34/g' {} + 2>/dev/null || true
          echo "✓ Pub cache patch complete"

      - name: Build Release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_log.txt

      - name: Report Failure Logs
        if: failure()
        run: |
          echo "### ❌ Build Failure Summary (Last 60 lines):"
          tail -n 60 build_log.txt
          ERR=$(grep -E "FAILURE|Error:|Execution failed|cannot find symbol|package .* does not exist" build_log.txt | tail -n 5 | tr '\n' ' ' || echo "Build failed")
          echo "::error title=Gradle Error::$ERR"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Failure-Log
          path: build_log.txt

      - name: Verify and Package APK
        run: |
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apk/BikeParkGo-release.apk
          echo "### 📦 Generated APK:"
          ls -lh release-apk/BikeParkGo-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BikeParkGo-Release-APK
          path: release-apk/BikeParkGo-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "BikeParkGo v1.0.0 Production APK"
          body: |
            ## 🏍️ BikeParkGo (PujoBike) - Production Release
            **Durga Puja Safe Bike Parking Tracker with Day/Night Mode and Cloud Sync**

            ### 🚀 Features Included:
            - **🎪 Dynamic Pandal Slider**: Interactive carousel with top Kolkata pandals managed directly from Google Drive.
            - **🎨 Festive Redesign & App Logo**: Custom Durga Puja Trishul & Bike launcher icon with Sindoor & Gold themes.
            - **🌓 Day / Night Mode**: High-contrast Puja aesthetics for bright daylight and night pandal hopping.
            - **👤 Customer Login & Guest Checkout**: Photo capture + Google Drive sync with welcoming motto:
              *"Enjoy Pujo, you care for your dear ones, I care for your vehicles!"*
            - **📍 High-Accuracy GPS & Rotating Radar**: Haversine distance counter + arrow pointing straight to your bike.
            - **🗣️ Turn-by-Turn Walking Navigation**: Native walking directions without paid API keys.
            - **100% Free**: Zero subscription fees, zero paid Google Maps API keys.

            ### 📲 Direct APK Download:
            Download **[BikeParkGo-release.apk](https://github.com/SaikatSantra/bikeparkgo/releases/download/v1.0.0/BikeParkGo-release.apk)** to install directly on your Android phone.
          files: release-apk/BikeParkGo-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
