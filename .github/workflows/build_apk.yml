name: Build PujoBike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Ensure Android Wrapper
        run: flutter create --platforms=android --org com.pujobike .

      - name: Restore Custom Android Permissions
        run: |
          mkdir -p android/app/src/main
          cp -f AndroidManifest_custom.xml android/app/src/main/AndroidManifest.xml || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PujoBike-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
