name: Build PujoBike APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Generate Official Android Project
        run: flutter create --platforms=android --org com.bikeparkgo .

      - name: Configure Android Permissions and MinSdk 21
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()
          perms = '''
    <uses-permission android:name=\"android.permission.INTERNET\"/>
    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
    <uses-permission android:name=\"android.permission.CAMERA\"/>
    <uses-permission android:name=\"android.permission.VIBRATE\"/>
  '''
          if 'ACCESS_FINE_LOCATION' not in content:
              content = content.replace('<application', perms + '  <application')
              with open(manifest_path, 'w') as f:
                  f.write(content)

          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              g_content = f.read()
          g_content = g_content.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
          g_content = g_content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
          with open(gradle_path, 'w') as f:
              f.write(g_content)
          "

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BikeParkGo-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
